  /* =========================
   下拉菜单按钮样式
========================= */
.pill-dropdown {
  position: relative; /* 关键：让子菜单相对于它定位 */
  display: inline-block;
}

/* 2. 触发按钮（原本的 pill 样式微调） */
.pill-dropdown .pill.trigger {
  cursor: default; /* 鼠标放上去不显示手型，或者保留 pointer */
  padding-right: 12px; /* 给右边的小箭头留点空间 */
}

/* 3. 下拉菜单本体 (默认隐藏) */
.dropdown-menu {
  display: none; /* 默认不显示 */
  position: absolute;
  top: 110%; /* 在按钮正下方，留一点点缝隙 */
  left: 50%;
  transform: translateX(-50%); /* 水平居中 */
  background: var(--panel); /* 跟随主题背景 */
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 6px;
  min-width: 140px; /* 菜单最小宽度 */
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
  z-index: 100; /* 保证浮在最上面 */
  backdrop-filter: blur(12px); /* 磨砂玻璃效果 */
  text-align: left;
}

/* 4. 鼠标悬停在容器上时，显示菜单 */
.pill-dropdown:hover .dropdown-menu {
  display: block;
  animation: fadeIn 0.2s ease;
}

/* 5. 菜单里的子按钮样式 */
.dropdown-menu a {
  display: block;
  padding: 8px 12px;
  color: var(--text);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  border-radius: 8px;
  transition: background 0.2s;
  white-space: nowrap; /* 防止文字换行 */
}

.dropdown-menu a:hover {
  background: rgba(127, 127, 127, 0.15); /* 鼠标悬停变色 */
  color: var(--text);
}

/* 简单的淡入动画 */
@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -10px); }
  to { opacity: 1; transform: translate(-50%, 0); }
}

.carousel.two-col .demo-card {
  /* 假设 gap 是 18px，那么 50% 减去 9px 刚好。减去 10px 留出一点点安全余量 */
  flex: 0 0 calc(50% - 10px);
  min-width: 0;
  box-sizing: border-box;
}

/* 关键1：取消固定的卡片占位比例，让它自适应特殊的视频比例 */
.carousel.two-col .frame {
  aspect-ratio: auto; /* 取消默认的 16/9 等比例限制 */
  width: 100%;
  height: auto;
  background: var(--bg); /* 如果视频有黑边，可以和背景融为一体 */
}

/* 关键2：确保视频内容完整显示（contain），绝不裁切（cover） */
.carousel.two-col .frame video {
  width: 100%;
  height: auto;
  object-fit: contain; /* contain 保证完整显示所有边缘，而不是 cover 的强制填满并裁切 */
  display: block; /* 去除底部默认的幽灵空白 */
}

/* 手机端依然保持单排，防止视频缩得太小看不清 */
@media (max-width: 768px) {
  .carousel.two-col .demo-card {
    flex: 0 0 100%;
  }
}
/* 手机端依然保持 1 个，防止太挤 */
@media (max-width: 768px) {

.adaptive-grid {
  display: flex;
  gap: 16px;
  width: 100%;
  /* 关键：拉伸对齐，让所有卡片高度一致（以最高的为准） */
  align-items: stretch; 
  justify-content: center;
}

.adaptive-grid .hitem {
  /* 关键：平分空间 */
  flex: 1;
  /* 限制一下，防止单张图时变得巨大，或者为了美观 */
  /* 如果你想强制最多3个填满，不用改这里，HTML放3个div即可 */
  width: auto; 
  max-width: 100%; 
  
  display: flex;
  flex-direction: column;
}

/* 让图片在卡片里自适应，并加上放大镜手势 */
.adaptive-grid .hitem img {
  width: 100%;
  height: 100%; /* 撑满高度 */
  object-fit: contain; /* 保持比例，如果卡片被拉高，图片居中不裁剪 */
  background: #fff; /* 防止透明PNG在拉伸区域显得奇怪，可选 */
  cursor: zoom-in; /* 鼠标放上去显示放大镜 */
  transition: opacity 0.2s;
}
.adaptive-grid .hitem img:hover {
  opacity: 0.9;
}

.lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.9); /* 背景黑一点，沉浸感强 */
  backdrop-filter: blur(5px);      /* 背景稍微模糊 */
  
  /* 关键改动 1：不再用 flex 强制居中，而是允许内容溢出滚动 */
  display: block;      
  overflow-y: auto;   /* 开启垂直滚动条 */
  overflow-x: hidden; /* 只有极宽的图才需要x轴滚动，通常y轴够了 */
  
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  
  /* 给上下留点呼吸空间，防止图片贴边 */
  padding: 40px 0; 
  text-align: center; /* 保证图片水平居中 */
  cursor: zoom-out;
}

.lightbox.active {
  opacity: 1;
  pointer-events: all;
}

.lightbox img {
  /* 关键改动 2：宽度限制在屏幕内，但高度不限制 */
  max-width: 90vw;  /* 宽度最多占屏幕90%，防止太宽 */
  width: auto;      /* 保持比例 */
  height: auto;     /* 高度自然撑开！长图就会很长 */
  max-height: none; /* 绝对不要限制最大高度 */
  
  display: inline-block; /* 配合 text-align: center */
  vertical-align: middle;
  
  border-radius: 4px;
  box-shadow: 0 5px 30px rgba(0,0,0,0.5);
  
  /* 简单的出现动画 */
  transform: scale(0.96);
  transition: transform 0.3s cubic-bezier(0.2, 0, 0.2, 1);
}

.lightbox.active img {
  transform: scale(1);
}

    /* ===== 背景层：视频优先，失败则 fallback 图 ===== */
.bg-layer{
  position: fixed;
  inset: 0;
  z-index: -2;
  background: var(--page-background);
}

/* ✅ 新增：背景染色罩层（随主题变黑/变白） */
.bg-layer::after{
  content:"";
  position:absolute;
  inset:0;
  background: var(--page-sheen);
  pointer-events:none;
}

#bg-video{
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(var(--video-brightness)) saturate(1.05);
}

.bg-fallback{
  position:absolute;
  inset:0;
  background: var(--bg);
  filter: brightness(var(--fallback-brightness)) saturate(1.05);
  opacity: 0.92;
  display:none;
}

.vignette{
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(80% 58% at 15% 8%, var(--spot1), transparent 70%),
    radial-gradient(75% 58% at 85% 22%, var(--spot3), transparent 72%),
    radial-gradient(70% 55% at 50% 88%, var(--spot2), transparent 74%),
    linear-gradient(180deg, transparent 40%, var(--vignette-outer));
  pointer-events:none;
}

  <script>
    const THEME_KEY = "theme";
    const htmlEl = document.documentElement;
    const themeHint = document.getElementById("themeHint");
    const themeBtn = document.getElementById("toggleTheme");
    function applyTheme(mode) {
      if (mode === "auto") {
        htmlEl.removeAttribute("data-theme");
        themeHint.textContent = "Auto";
      } else {
        htmlEl.setAttribute("data-theme", mode);
        themeHint.textContent = mode === "dark" ? "Night" : "Light";
      }
    }
    function getNextTheme(cur) {
      if (cur === "auto") return "dark";
      if (cur === "dark") return "light";
      return "auto";
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "auto");
    themeBtn.addEventListener("click", () => {
      const next = getNextTheme(localStorage.getItem(THEME_KEY) || "auto");
      localStorage.setItem(THEME_KEY, next);
      applyTheme(next);
    });
  </script>
